{% extends 'base.html' %}

{% block title %}Edit Profile | Friday{% endblock %}

{% block content %}
<div class="container">
  <div class="profile-edit-container">
    <h1>Edit Profile</h1>
    
    <form method="post" enctype="multipart/form-data" class="profile-form">
      {% csrf_token %}
      
      <!-- Render the forms inside paragraphs -->
      {{ uform.as_p }}
      {{ pform.as_p }}
      
      <div class="profile-form-actions">
        <a href="{% url 'profile' %}" class="btn btn-outline" style="margin-right: 12px;">Cancel</a>
        <button type="submit" class="btn btn-dark">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
